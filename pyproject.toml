[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bati-bank-credit-scoring-mlops"
version = "1.0.0"
description = "Production-grade MLOps implementation for credit risk assessment using alternative data"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Bati Bank MLOps Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.25",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=1.7",
    "lightgbm>=4.3",
    "woe>=0.0.7",
    "xverse>=0.4.0",
    "shap>=0.42",
    "fastapi>=0.103",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.3",
    "pydantic-settings>=2.0",
    "mlflow>=2.9",
    "joblib>=1.3",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",
    "optuna>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "flake8>=7.0",
    "black>=24.10",
    "mypy>=1.5",
    "isort>=5.12",
]

[project.urls]
Homepage = "https://github.com/habeneyasu/bati-bank-credit-scoring-mlops"
Documentation = "https://github.com/habeneyasu/bati-bank-credit-scoring-mlops/blob/main/README.md"
Repository = "https://github.com/habeneyasu/bati-bank-credit-scoring-mlops"

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "venv/",
    "mlruns/",
    "build/",
    "dist/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-W", "ignore::DeprecationWarning:urllib3",
    "-W", "ignore::DeprecationWarning:mlflow",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

asyncio_mode = "auto"
env = [
    "MLFLOW_DISABLE_TELEMETRY=true",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
