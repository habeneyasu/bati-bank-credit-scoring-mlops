version: '3.8'

services:
  credit-scoring-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-scoring-api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=file:./mlruns
      - MODEL_NAME=credit_scoring_model
      - MODEL_STAGE=Production
      - API_PORT=8000
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - ENABLE_METRICS=true
      - ENABLE_RATE_LIMITING=false
    volumes:
      # Mount MLflow runs directory to persist model registry
      - ./mlruns:/app/mlruns
      # Mount logs directory
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - credit-scoring-network

networks:
  credit-scoring-network:
    driver: bridge
